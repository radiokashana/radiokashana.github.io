name: Update Visual Test Baselines

on:
  # Allow manual triggering to generate new baselines
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL to generate baselines from (leave empty for develop branch)'
        required: false
        type: string
      commit_message:
        description: 'Commit message for baseline update'
        required: false
        default: 'Update visual test baselines'
        type: string

  # Also allow triggering from other workflows or specific branches
  workflow_call:
    inputs:
      target_url:
        description: 'URL to generate baselines from'
        required: false
        type: string

jobs:
  update-baselines:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Determine target URL
        id: target-url
        run: |
          if [ -n "${{ inputs.target_url }}" ]; then
            echo "url=${{ inputs.target_url }}" >> $GITHUB_OUTPUT
            echo "Using provided URL: ${{ inputs.target_url }}"
          else
            # Use the live production site as default
            echo "url=https://radiokashana.org" >> $GITHUB_OUTPUT
            echo "Using production site as baseline source"
          fi

      - name: Generate baseline snapshots
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.target-url.outputs.url }}
        run: |
          echo "Generating baselines from: $PLAYWRIGHT_BASE_URL"
          
          # Remove any existing baselines
          rm -rf tests/visual-snapshots.spec.js-snapshots/
          
          # Generate new baselines by running tests (they'll create snapshots on first run)
          yarn test:visual:external --reporter=line || true
          
          # If that didn't work, force update snapshots
          yarn test:visual:external --update-snapshots --reporter=line || true

      - name: Check if baselines were created
        run: |
          if [ -d "tests/visual-snapshots.spec.js-snapshots" ] && [ "$(ls -A tests/visual-snapshots.spec.js-snapshots/)" ]; then
            echo "✅ Baseline snapshots created successfully"
            ls -la tests/visual-snapshots.spec.js-snapshots/
          else
            echo "❌ No baseline snapshots were created"
            exit 1
          fi

      - name: Commit and push baselines
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Add the snapshots
          git add tests/visual-snapshots.spec.js-snapshots/
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "${{ inputs.commit_message || 'Update visual test baselines' }}

            Generated from: ${{ steps.target-url.outputs.url }}
            
            🤖 Automated baseline update via GitHub Actions"
            git push
            echo "✅ Baselines committed and pushed"
          fi

      - name: Summary
        run: |
          echo "## 📸 Visual Test Baselines Updated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Source URL:** ${{ steps.target-url.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Files updated:**" >> $GITHUB_STEP_SUMMARY
          if [ -d "tests/visual-snapshots.spec.js-snapshots" ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            ls tests/visual-snapshots.spec.js-snapshots/ >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi